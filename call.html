<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>О наших созвонах</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1e1f22;
            --card-bg: #2b2d31;
            --text-main: #f2f3f5;
            --text-muted: #b5bac1;
            --discord-green: #23a55a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }

        .discord-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(35, 165, 90, 0.3);
        }

        .avatar-wrapper {
            position: relative;
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            background: #313338;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border: 3px solid var(--discord-green);
            box-shadow: 0 0 15px rgba(35, 165, 90, 0.25);
        }

        /* Живые звуковые волны */
        .wave-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 24px;
            margin-bottom: 20px;
        }

        .bar {
            width: 4px;
            height: 8px;
            background: var(--discord-green);
            border-radius: 2px;
            animation: soundWave 0.9s infinite ease-in-out;
        }

        .bar:nth-child(2) { animation-delay: 0.15s; }
        .bar:nth-child(3) { animation-delay: 0.3s; }
        .bar:nth-child(4) { animation-delay: 0.45s; }
        .bar:nth-child(5) { animation-delay: 0.2s; }

        @keyframes soundWave {
            0%, 100% { height: 6px; }
            50% { height: 22px; }
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 2.7rem;
            color: #fff;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        p {
            font-size: 0.88rem;
            line-height: 1.65;
            color: var(--text-muted);
        }

        .highlight {
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← На главную</a>

    <div class="discord-card">
        <div class="avatar-wrapper">🎧</div>

        <div class="wave-container">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <h1>Мой день ужасен без тебя</h1>
        <p>
            Если за весь день у нас не получается созвониться — он проходит просто впустую и ощущается максимально серым.<br><br>
            <span class="highlight">Слышать твой голос в наушниках</span> — это лучшее, что вообще может случиться за день. Спасибо, что ты есть :3
        </p>
    </div>

</body>
</html>
